name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      upload_pages:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, lint, test, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-qa
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        if: inputs.upload_pages && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist
